# Advanced !3 deployment for a docker swarm cluster:
# horizontally scaled api/ui/draw instances, traefik as reverse proxy,
# postgres as database and valkey as shared cache between all instances.
# Deploy with: docker stack deploy -c compose.swarm.yml not3

x-restart: &restart
  condition: any

x-instances:
  api: &api-instances 5
  ui: &ui-instances 2
  draw: &draw-instances 2

x-env: &env
  BEHIND_PROXY: "true"
  DATABASE_MODE: pg
  DATABASE_HOST: db
  DATABASE_USERNAME: db
  DATABASE_PASSWORD: db
  DATABASE_NAME: db
  VALKEY_ENABLED: "true"
  VALKEY_HOST: valkey
  P2P_ENABLED: ${P2P_ENABLED:-false}
  # For serverless databases (e.g. neon.tech) additionally set:
  # DATABASE_REQUEST_OPTIMIZATION: light # or 'hard', see the README

x-ui: &ui
  environment:
    API_URL: http://<domain>/api
    DRAW_URL: http://<domain>/api/draw/
    TERMS_OF_SERVICE_URL: https://example.com

###

services:
  traefik:
    image: traefik:v3
    command:
      - --api.insecure=true
      - --providers.swarm=true
      - --entrypoints.http.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      restart_policy: *restart
      placement:
        constraints:
          - node.role == manager

  # The parent instance runs the schedulers (cleanup, flush) exactly once.
  api_parent:
    image: ghcr.io/not-three/api:latest
    environment: *env
    deploy:
      restart_policy: *restart
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/info"]
      interval: 30s
      timeout: 10s
      retries: 3

  api_child:
    image: ghcr.io/not-three/api:latest
    environment:
      <<: *env
      CHILD_INSTANCE: "true"
    deploy:
      restart_policy: *restart
      replicas: *api-instances
      labels:
        - "traefik.enable=true"
        - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
        - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
        - "traefik.http.routers.api.entrypoints=http"
        - "traefik.http.routers.api.middlewares=api-stripprefix"
        - "traefik.http.services.api.loadbalancer.server.port=4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/info"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    image: ghcr.io/not-three/ui:latest
    <<: *ui
    deploy:
      restart_policy: *restart
      replicas: *ui-instances
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ui.rule=PathPrefix(`/`)"
        - "traefik.http.routers.ui.entrypoints=http"
        - "traefik.http.services.ui.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  draw:
    image: ghcr.io/not-three/draw:latest
    deploy:
      restart_policy: *restart
      replicas: *draw-instances
      labels:
        - "traefik.enable=true"
        - "traefik.http.middlewares.draw-stripprefix.stripprefix.prefixes=/api/draw/"
        - "traefik.http.routers.draw.rule=PathPrefix(`/api/draw/`)"
        - "traefik.http.routers.draw.entrypoints=http"
        - "traefik.http.routers.draw.middlewares=draw-stripprefix"
        - "traefik.http.services.draw.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  valkey:
    image: valkey/valkey:8
    # AOF persistence, so buffered notes survive a valkey restart
    # (only relevant for DATABASE_REQUEST_OPTIMIZATION 'hard').
    command: valkey-server --appendonly yes
    volumes:
      - valkey:/data
    deploy:
      restart_policy: *restart
      placement:
        constraints:
          - node.role == manager
          # Stateful services should be pinned to a specific server, so they
          # always start on the node that holds their volume, e.g.:
          # - node.hostname == server-01
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:14.5
    environment:
      POSTGRES_PASSWORD: db
      POSTGRES_USER: db
      POSTGRES_DB: db
    volumes:
      - db:/var/lib/postgresql/data
    deploy:
      restart_policy: *restart
      placement:
        constraints:
          - node.role == manager
          # Stateful services should be pinned to a specific server, so they
          # always start on the node that holds their volume, e.g.:
          # - node.hostname == server-01
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db:
  valkey:
